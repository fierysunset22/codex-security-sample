name: Codex Security dry run

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  setup-check:
    name: Codex Security setup check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check Codex Security setup
        uses: openai/codex-security@02c70601a70dde2d1c9c9867d4ead298370890d1 # action-v0.11.0
        with:
          scope: diff
          dry-run: 'true'
          fail-on-severity: none
